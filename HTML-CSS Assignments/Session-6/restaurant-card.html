<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
    <style>
        .restaurant-card{
            width: 200px;
            margin: 100px;      
            padding: 20px;          
            border: 2px solid #e23744;
            border-radius: 10px;
            background-color: white;
        }
        .restaurant-name{
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid rgb(199, 192, 192);
            font-size: 25px;
            font-weight: bold;
            color: #e23744;
        }
        .cuisine{
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid  rgb(199, 192, 192);
        }
        .rating{
            padding: 10px;
            border: 1px solid rgb(199, 192, 192);
            background-color: #42c246;
            color: white;
            width: fit-content;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="restaurant-card">

        <div class="restaurant-name">
            Spice Garden
        </div>

        <div class="cuisine">
            <strong>Cuisine:</strong> North Indian, Chinese
        </div>

        <div class="rating">
            ⭐️ 4.5/5
        </div>

    </div>
</body>
</html>
