<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Tile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
        }

        .product-card {
            width: 250px;
            margin: 30px auto;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: white;
            text-align: center;
        }

        .product-image {
            width: 180px;
            height: auto;
        }

        .product-name {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .price {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            background-color: #388e3c;
            color: white;
            border-radius: 5px;
        }

        .hide-price {
            display: none;
        }
    </style>
</head>
<body>

    <div class="product-card">

        <img src="laptop.jpg" alt="Laptop" class="product-image">

        <span class="product-name">
            HP Laptop 15
        </span>

        <span class="price">
            ₹68,990
        </span>


    </div>

</body>
</html>
