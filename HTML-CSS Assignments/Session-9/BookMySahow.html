<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="row align-items-center">

        <!-- Movie Poster -->
        <div class="col-md-4 text-center">
            <img src="images/poster.jpeg"
                 alt="Movie Poster"
                 class="img-fluid rounded shadow">
        </div>

        <!-- Movie Details -->
        <div class="col-md-8">
            <h2>Avengers: Endgame</h2>

            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

            <p><strong>Rating:</strong> ⭐ 4.8/5</p>

            <p>
                Avengers: Endgame is an epic superhero movie where the Avengers
                unite to defeat Thanos and restore peace to the universe.
            </p>

            <button class="btn btn-danger btn-lg">
                🎟️ Book Now
            </button>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
