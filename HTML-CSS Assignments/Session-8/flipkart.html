<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4 text-primary">Flipkart Products</h2>

    <div class="row">

        <!-- Product Card 1 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="images/wireless headphone.jpeg"
                     class="card-img-top"
                     alt="Wireless Headphones">

                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="card-text">
                        High-quality wireless headphones with noise cancellation.
                    </p>
                    <h6 class="text-success">₹1,999</h6>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <!-- Product Card 2 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="images/smart watch.jpeg"
                     class="card-img-top"
                     alt="Smart Watch">

                <div class="card-body">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="card-text">
                        Stylish smartwatch with fitness tracking and heart-rate monitor.
                    </p>
                    <h6 class="text-success">₹3,499</h6>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <!-- Product Card 3 -->
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm">
                <img src="images/speaker.jpeg"
                     class="card-img-top"
                     alt="Bluetooth Speaker">

                <div class="card-body">
                    <h5 class="card-title">Bluetooth Speaker</h5>
                    <p class="card-text">
                        Portable Bluetooth speaker with powerful sound quality.
                    </p>
                    <h6 class="text-success">₹2,299</h6>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
