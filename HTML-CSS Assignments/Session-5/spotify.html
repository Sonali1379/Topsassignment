<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist</title>
    <style>
        .playlist-item{
            background-color: rgba(34, 199, 8, 0.962);
            color: white;
            padding: 10px 20px;
            font-size: larger;
            font-style: oblique;
            font-family: 'Times New Roman', Times, serif;
            margin: 8px 2px;
            border: none;
            border-radius: 5px;
        }
        #now-playing{
            background-color:  rgb(83, 83, 156);
            color: aqua;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Spotify Playlist</h2>
    <div class="playlist-item">Barish</div>
    <div class="playlist-item">Ishq Mubarak</div>
    <div class="playlist-item" id="now-playing">Dil Mein Ho Tum</div>
    <div class="playlist-item">Muqaabla</div>
    <div class="playlist-item">Taaron ke sahar Mein</div>
</body>
</html>
