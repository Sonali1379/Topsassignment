<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Apps</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin: 40px;
            padding: 20px;
            border: 2px solid #62859b;
            background-color: white;
        }

        .container img {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            border: 1px solid #6da7cd;
        }
    </style>
</head>
<body>

    <h1>My Favorite Apps</h1>

    <div class="container">
        <img src="instagram images.jpeg" alt="Instagram">
        <img src="whatsapp image.jpeg" alt="WhatsApp">
        <img src="zomato images.png" alt="Zomato">
        <img src="spotify images.png" alt="Spotify">
    </div>

</body>
</html>
