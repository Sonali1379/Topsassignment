<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #2874F0;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        /* Product Card */
        .product-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .product-card img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .product-card h3 {
            margin: 10px 0;
            color: #333;
        }

         /* Tablet View */
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile View */
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Flipkart Product Grid</h1>

    <section class="product-grid">

        <div class="product-card">
            <img src="images-2/product-1.webp" alt="Product 1">
            <h3>Wireless Headphones</h3>
        </div>

        <div class="product-card">
            <img src="images-2/product-2" alt="Product 2">
            <h3>Smart Watch</h3>
        </div>

        <div class="product-card">
            <img src="images-2/product-3.jpg" alt="Product 3">
            <h3>Bluetooth Speaker</h3>
        </div>

        <div class="product-card">
            <img src="images-2/product-4.webp" alt="Product 4">
            <h3>Laptop Backpack</h3>
        </div>

        <div class="product-card">
            <img src="images-2/product-5.webp" alt="Product 5">
            <h3>Gaming Mouse</h3>
        </div>

        <div class="product-card">
            <img src="images-2/product-6.webp" alt="Product 6">
            <h3>Power Bank</h3>
        </div>

    </section>

</body>
</html>
