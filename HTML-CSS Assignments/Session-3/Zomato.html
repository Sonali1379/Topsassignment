<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Food Order Form</title>
</head>
<body>
    <h2>Zomato Food Order Form</h2>
    <form action="#" method="POST">
        <label for="orderid">Order ID:</label><br>
        <input
            type="text"
            id="orderid"
            name="orderid"
            value="ORD12345"
            disabled>
        <br><br>
        <label for="username">Name:</label><br>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
            required>
        <br><br>

        <label for="food">Select Food Item:</label><br>
        <select id="food" name="food" required>
            <option value="" selected disabled>-- Select Food --</option>
            <option value="Pizza">Pizza</option>
            <option value="Burger">Burger</option>
            <option value="Biryani">Biryani</option>
        </select>
        <br><br>

        <label for="quantity">Quantity:</label><br>
        <input
            type="number"
            id="quantity"
            name="quantity"
            required>
        <br><br>

        <label for="instructions">Delivery Instructions:</label><br>
        <textarea
            id="instructions"
            name="instructions"
            rows="5"
            cols="40"
            placeholder="Enter your delivery instructions..."
            required></textarea>
        <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
