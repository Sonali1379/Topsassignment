<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Featured Movies</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

<div class="container mt-5">

    <h2 class="text-center text-white mb-4">
        Featured Movies
    </h2>

    <!-- Carousel -->
    <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"></button>
        </div>

        <!-- Carousel Items -->
        <div class="carousel-inner">

            <!-- Movie 1 -->
            <div class="carousel-item active">
                <img src="Avengers.jpeg"
                     class="d-block w-100"
                     alt="Avengers Endgame">

                <div class="carousel-caption d-none d-md-block">
                    <h5>Avengers: Endgame</h5>
                    <p>Action | Adventure | Sci-Fi</p>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="carousel-item">
                <img src="spiderman.jpeg"
                     class="d-block w-100"
                     alt="Spider-Man">

                <div class="carousel-caption d-none d-md-block">
                    <h5>Spider-Man</h5>
                    <p>Action | Superhero</p>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="carousel-item">
                <img src="batman.jpeg"
                     class="d-block w-100"
                     alt="The Batman">

                <div class="carousel-caption d-none d-md-block">
                    <h5>The Batman</h5>
                    <p>Action | Crime | Drama</p>
                </div>
            </div>

        </div>

        <!-- Previous Button -->
        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <!-- Next Button -->
        <button class="carousel-control-next"
                type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
